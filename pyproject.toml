[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "semerg"
# requests is floored at 2.32.4: earlier releases leak .netrc credentials
# to the redirect target (CVE-2024-47081).
dependencies = ["click>=8.1.7", "requests>=2.32.4"]
requires-python = ">= 3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
semerg = "semerg.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "semerg.__version__"}

[project.urls]
Homepage = "https://github.com/sjlehtin/semerg"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
