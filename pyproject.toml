[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "semerg"
dependencies = ["click>=8.1.7", "requests>=2.31.0"]
requires-python = ">= 3.11"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
semerg = "semerg.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "semerg.__version__"}

[project.urls]
Homepage = "https://github.com/sjlehtin/semerg"

[project.optional-dependencies]
# `tox` and `tox-uv` used to be listed here but there has never been a tox
# config, so they could not run. CI invokes pytest directly.
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
